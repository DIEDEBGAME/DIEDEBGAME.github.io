<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masa Héctor - ¡El Rey del Nixtamal!</title>
    <style>
        /* ANIMACIÓN DEL TÍTULO */
        @keyframes tituloLoco {
            0% { color: #ffeb3b; text-shadow: 0 0 10px #fff, 3px 3px 0 #d32f2f; }
            50% { color: #fff; text-shadow: 0 0 20px #ffeb3b, 3px 3px 0 #2e7d32; }
            100% { color: #ffeb3b; text-shadow: 0 0 10px #fff, 3px 3px 0 #d32f2f; }
        }

        body {
            margin: 0; padding: 10px; background-color: #0d1b2a;
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='10' y='30' font-size='20' opacity='0.1'%3E🌮%3C/text%3E%3Ctext x='50' y='60' font-size='20' opacity='0.1'%3E🌽%3C/text%3E%3Ctext x='20' y='70' font-size='20' opacity='0.1'%3E🌶️%3C/text%3E%3C/svg%3E");
            font-family: 'Arial Black', sans-serif;
            display: flex; justify-content: center; overflow-x: hidden;
        }

        .main-frame {
            width: 100%; max-width: 400px;
            background: #004e92; border: 6px solid #ffffff;
            border-radius: 40px; box-shadow: 0 0 30px rgba(255,255,255,0.5);
            overflow: hidden; display: flex; flex-direction: column;
            align-items: center; padding-bottom: 20px; position: relative;
        }

        /* TÍTULO SUPER LLAMATIVO */
        .super-titulo {
            margin-top: 15px;
            text-align: center;
            font-size: 1.8rem;
            line-height: 1;
            animation: tituloLoco 1.5s infinite;
            -webkit-text-stroke: 1.5px #000;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        .sub-titulo {
            color: #FFD700;
            font-size: 0.9rem;
            text-transform: uppercase;
            background: rgba(0,0,0,0.4);
            padding: 2px 15px;
            border-radius: 20px;
            margin-top: 5px;
        }

        .contacts-header { display: flex; justify-content: space-around; width: 100%; margin-top: 15px; }

        .avatar-box {
            width: 130px; height: 130px; border-radius: 50%;
            border: 4px solid white; text-align: center;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; color: white; text-decoration: none;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        .blue-box { background: radial-gradient(circle, #00d2ff, #3a7bd5); }
        .red-box { background: radial-gradient(circle, #ff5f6d, #ffc371); }
        
        .avatar-box b { font-size: 0.75rem; display: block; }
        .avatar-box p { 
            margin: 0; font-size: 0.82rem; font-weight: bold; 
            background: rgba(0,0,0,0.2); padding: 2px 5px; border-radius: 5px;
        }

        .sun-section { position: relative; margin: 10px 0; }
        .sun-graphic { font-size: 160px; filter: drop-shadow(0 0 15px orange); }
        
        .price-overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); text-align: center; width: 100%;
        }

        .price-big {
            font-size: 4.8rem; color: #d32f2f;
            -webkit-text-stroke: 2px white; margin: 0;
        }

        .green-ribbon {
            background: #2e7d32; color: white; width: 110%;
            padding: 12px; text-align: center; transform: rotate(-1deg);
            border-top: 3px solid white; border-bottom: 3px solid white;
            font-size: 0.85rem; margin: 15px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .schedule-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; padding: 0 15px; width: 90%;
        }

        .h-box {
            border-radius: 12px; border: 2px solid white;
            color: white; padding: 8px; text-align: center; font-size: 0.75rem;
            background: rgba(255,255,255,0.1);
        }

        .action-btn {
            width: 85%; margin-top: 15px; padding: 16px;
            border-radius: 20px; text-decoration: none;
            text-align: center; color: white; font-weight: bold;
            border: 4px solid white; box-shadow: 0 6px 0 rgba(0,0,0,0.3);
            font-size: 1.1rem;
        }
        .btn-orange { background: linear-gradient(#ff9800, #f57c00); }
        .btn-yellow { background: linear-gradient(#fdd835, #fbc02d); color: #333; }
    </style>
</head>
<body>

<div class="main-frame">
    <div class="super-titulo">¡MASA HÉCTOR!</div>
    <div class="sub-titulo">Molino "Beto"</div>

    <div class="contacts-header">
        <a href="tel:7651030888" class="avatar-box blue-box">
            <span style="font-size: 1.8rem;">🤠</span>
            <b>HÉCTOR MASA</b>
            <p>765 103 0888</p>
        </a>
        <a href="tel:+527656880431" class="avatar-box red-box">
            <span style="font-size: 1.8rem;">👨🏻‍💼</span>
            <b>BETO NEGOCIO</b>
            <p>765 688 0431</p>
        </a>
    </div>

    <div class="sun-section">
        <div class="sun-graphic">☀️</div>
        <div class="price-overlay">
            <div style="background:white; color:#2e7d32; padding:3px 12px; border-radius:10px; font-size:0.75rem; border:2px solid #2e7d32; font-weight:bold;">¡CALIDAD GARANTIZADA!</div>
            <h2 class="price-big">¡$14!</h2>
        </div>
    </div>

    <div class="green-ribbon">
        🥤 ¡TENEMOS MINI-TIENDA! 🍟<br>
        REFRESCOS • PAPEL • BOTANAS
    </div>

    <div class="schedule-grid">
        <div class="h-box" style="background: #0277bd;">L-V: 7am–7pm</div>
        <div class="h-box" style="background: #f9a825;">SÁB: 7am–4pm</div>
        <div class="h-box" style="background: #ad1457;">DOM: 7am–2pm</div>
        <div class="h-box" style="background: #d84315;">🔥 ¡ABIERTO HOY!</div>
    </div>

    <a href="https://maps.app.goo.gl/HPb3aJk51zZ86utE8" class="action-btn btn-orange">
        📍 VER RUTA Y UBICACIÓN
    </a>

    <a href="https://maps.app.goo.gl/HPb3aJk51zZ86utE8" class="action-btn btn-yellow">
        ⭐ ¡TU OPINIÓN VALE MUCHO!
    </a>

    <div style="margin-top: 10px; font-size: 1.5rem;">🌵🌮🌯🪅</div>
</div>

</body>
</html>
